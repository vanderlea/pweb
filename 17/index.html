<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade 17 - Galeria de Gatos Completa</title>
  
  <link href="https://jsdelivr.net" rel="stylesheet">
  
  <style>
    
    .conteudo {
      background: #DCDCDC;   
      border: 2px solid blue; 
    }
    .linha {
      background: #FFEBCD;   
      border: 2px solid black;
    }
    .coluna {
      background: #87CEEB;   
      border: 2px solid black;
    }

    
    .efeito-galeria {
      overflow: hidden; 
      position: relative;
      border-radius: 4px;
      height: 100%;
    }

    .efeito-galeria img {
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      width: 100%;
      height: 100%;
      object-fit: cover; 
    }

    
    .efeito-galeria:hover img {
      transform: scale(1.08);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>

  
  <div class="container conteudo my-4 p-3">
    <h2 class="text-center mb-4 text-dark font-monospace">Galeria de Gatos - Atividade 17</h2>
    
    
    <div class="row linha g-2 p-2"> 
      
      
      <div class="col-md-6 coluna p-2">
        <div class="efeito-galeria" style="min-height: 400px;">
          <img src="gato-grande.jpg" alt="Gato Principal Grande">
        </div>
      </div>

      
      <div class="col-md-6 coluna p-2">
        <div class="row linha g-2 p-1">
          
          
          <div class="col-12 coluna p-1">
            <div class="efeito-galeria" style="height: 140px;">
              <img src="gato-oculos.jpg" alt="Gato com óculos">
            </div>
          </div>

          
          <div class="col-6 coluna p-1">
            <div class="efeito-galeria" style="height: 120px;">
              <img src="gato-olhando.jpg" alt="Gato olhando">
            </div>
          </div>
          <div class="col-6 coluna p-1">
            <div class="efeito-galeria" style="height: 120px;">
              <img src="gato-deitado.jpg" alt="Gato deitado">
            </div>
          </div>

          
          <div class="col-4 coluna p-1">
            <div class="efeito-galeria" style="height: 100px;">
              <img src="gato-fofo.jpg" alt="Gato fofo">
            </div>
          </div>
          <div class="col-4 coluna p-1">
            <div class="efeito-galeria" style="height: 100px;">
              <img src="gato-fixo.jpg" alt="Gato olhando fixo">
            </div>
          </div>
          <div class="col-4 coluna p-1">
            <div class="efeito-galeria" style="height: 100px;">
              <img src="gato-brincalhao.jpg" alt="Gato brincalhão">
            </div>
          </div>

        </div>
      </div> 

    </div>
  </div>

</body>
</html>
