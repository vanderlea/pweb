<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Atividade 07 - Famílias de Fontes</title>
    <style type="text/css">
    
        .conteudo {
            font-size: 30px; 
        }

        .fonteSerif {
            font-family: "Times New Roman", Times, Georgia, serif;
            font-size: 5em;
            font-style: normal;
        }

        .fonteSans-Serif {
            font-family: Verdana, Arial, Helvetica, sans-serif;
            font-size: 2.5em;
            font-style: italic;
        }

        .fonteMonospace {
            font-family: "Courier New", Courier, Monaco, monospace;
            font-size: 1.25em;
            font-style: oblique;
        }
    </style>

</head>

<body>
    
    <div class="conteudo">
        <p class="fonteSerif">Programação Web</p>
        <p class="fonteSans-Serif">Programação Web</p>
        <p class="fonteMonospace">Programação Web</p>
    </div>

</body>


</html>
