<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Atividade 07 - Famílias de Fontes</title>
    <style type="text/css">
        /* Configuração do container pai (Slides 28, 29 e 30) */
        /* Altere o valor abaixo de 8px para 30px para testar o efeito relativo do 'em' */
        .conteudo {
            font-size: 30px; 
        }

        /* Classe Serif com sistema fallback e tamanho convertido para em (Slide 16, 19 e 27) */
        .fonteSerif {
            font-family: "Times New Roman", Times, Georgia, serif;
            font-size: 5em; /* 80px / 16 = 5em */
            font-style: normal;
        }

        /* Classe Sans-Serif com sistema fallback, tamanho em em e estilo itálico */
        .fonteSans-Serif {
            font-family: Verdana, Arial, Helvetica, sans-serif;
            font-size: 2.5em; /* 40px / 16 = 2.5em */
            font-style: italic;
        }

        /* Classe Monospace com sistema fallback, tamanho em em e estilo oblíquo */
        .fonteMonospace {
            font-family: "Courier New", Courier, Monaco, monospace;
            font-size: 1.25em; /* 20px / 16 = 1.25em */
            font-style: oblique;
        }
    </style>

</head>

<body>
     <!-- Div container para testar a proporção relativa das fontes (Slide 29) -->
    <div class="conteudo">
        <p class="fonteSerif">Programação Web</p>
        <p class="fonteSans-Serif">Programação Web</p>
        <p class="fonteMonospace">Programação Web</p>
    </div>

</body>


</html>
