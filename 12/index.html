<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atributo data</title>
</head>

 <style>
        
        .pessoa {
            color: red;
            margin-bottom: 8px;
            cursor: pointer;
        }

        
        .pessoa[data-idade='30'] {
            color: blue;
        }

        
        .pessoa::before {
            content: "Nome: ";
        }

        .pessoa::after {
            content: " - Idade: " attr(data-idade) " Anos - C.P.F: " attr(data-cpf);
        }
    </style>

    <script type="text/javascript">
        
        function mostravalor(componente) {
            var nome = componente.textContent;
            alert(nome);
        }
    </script>
</head>
<body>

    <ul>
        <!-- Itens da lista com os atributos customizados data-* e o evento de clique -->
        <li class="pessoa" onclick="mostravalor(this)" data-idade="20" data-cpf="999">João</li>
        <li class="pessoa" onclick="mostravalor(this)" data-idade="30" data-cpf="888">José</li>
        <li class="pessoa" onclick="mostravalor(this)" data-idade="40" data-cpf="777">Maria</li>
    </ul>

</body>
</html>
