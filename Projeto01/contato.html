<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
</head>
<body>

    <header>
        <img src="img/logo.png" alt="Logo da Empresa" width="150">
        <nav>
            <a href="index.html">Principal</a> | 
            <a href="quem_somos.html">Quem Somos</a> | 
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <hr>

    <main>
        <h1>Fale Conosco</h1>
        
        <img src="img/contato.png" alt="Banner de Contato" width="300"><br><br>

        <form>
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome" required><br><br>

            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="assunto">Assunto:</label><br>
            <input type="text" id="assunto" name="assunto"><br><br>

            <label for="mensagem">Mensagem:</label><br>
            <textarea id="mensagem" name="mensagem" rows="5" cols="30" required></textarea><br><br>

            <input type="submit" value="Enviar Mensagem">
        </form>
    </main>

    <hr>

</body>
</html>
